<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScorePotato — Continuous NBA Box Scores</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        slate: {
                            850: '#151f32',
                            900: '#0f172a',
                            950: '#090d16',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Custom scrollbar styling */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased selection:bg-indigo-500 selection:text-white">

    <!-- Top Navigation / Header -->
    <header class="sticky top-0 z-40 bg-slate-900/90 backdrop-blur-md border-b border-slate-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
            
            <!-- Brand & Subtitle -->
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-amber-500 via-orange-500 to-indigo-600 flex items-center justify-center shadow-lg shadow-orange-500/20">
                    <i data-lucide="activity" class="w-6 h-6 text-white"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight text-white flex items-center gap-2">
                        ScorePotato
                    </h1>
                    <p class="text-xs text-slate-400 hidden sm:block">NBA Box Scores, The Lazy Way</p>
                </div>
            </div>

            <!-- Date Controls & Controls Header -->
            <div class="flex items-center gap-2 sm:gap-3">
                
                <!-- Quick Date Selector -->
                <div class="flex items-center bg-slate-800 p-1 rounded-lg border border-slate-700">
                    <button id="btn-prev-day" title="Previous Day" class="p-1.5 text-slate-400 hover:text-white rounded-md hover:bg-slate-700 transition">
                        <i data-lucide="chevron-left" class="w-4 h-4"></i>
                    </button>
                    
                    <button id="btn-yesterday" class="px-2.5 py-1 text-xs font-medium text-slate-300 hover:text-white rounded-md hover:bg-slate-700 transition">
                        Yesterday
                    </button>
                    <button id="btn-today" class="px-2.5 py-1 text-xs font-semibold text-white bg-indigo-600 rounded-md shadow-sm transition">
                        Today
                    </button>

                    <button id="btn-next-day" title="Next Day" class="p-1.5 text-slate-400 hover:text-white rounded-md hover:bg-slate-700 transition">
                        <i data-lucide="chevron-right" class="w-4 h-4"></i>
                    </button>
                </div>

                <!-- Custom Date Input -->
                <input type="date" id="date-picker" class="bg-slate-800 border border-slate-700 text-slate-200 text-xs rounded-lg px-2.5 py-1.5 focus:ring-2 focus:ring-indigo-500 focus:outline-none hidden md:block">

                <!-- Expand/Collapse All Toggle -->
                <button id="btn-toggle-all-games" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white text-xs font-medium rounded-lg border border-slate-700 transition flex items-center gap-1.5">
                    <i data-lucide="chevrons-up-down" class="w-3.5 h-3.5"></i>
                    <span id="lbl-toggle-all">Expand All</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">

        <!-- Banner / Slate Quick-Jump Ribbon -->
        <section class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl">
            <div class="flex flex-col lg:flex-row items-start lg:items-center justify-between gap-4 mb-3">
                <div class="flex items-center gap-2">
                    <i data-lucide="calendar" class="w-5 h-5 text-indigo-400"></i>
                    <h2 class="text-base font-semibold text-white" id="slate-header-title">NBA Slate — ...</h2>
                    <span id="slate-game-count" class="text-xs font-normal text-slate-400 bg-slate-800 px-2.5 py-0.5 rounded-full border border-slate-700">0 Games</span>
                </div>
            </div>

            <!-- Horizontal Mini Scoreboard Strip -->
            <div id="mini-scoreboard-strip" class="flex items-center gap-3 overflow-x-auto pb-2 scrollbar-thin">
                <!-- Mini Scoreboard Chips injected via JS -->
            </div>
        </section>

        <!-- Leaders & Laggards Collapsible Section -->
        <section id="leaderboard-section" class="bg-slate-900 border border-slate-800 rounded-2xl shadow-xl overflow-hidden transition-all">
            <button id="btn-toggle-leaderboard" class="w-full px-5 py-4 flex items-center justify-between bg-slate-900 hover:bg-slate-850 transition border-b border-slate-800/60 text-left">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-lg bg-amber-500/10 border border-amber-500/20 flex items-center justify-center">
                        <i data-lucide="trophy" class="w-4 h-4 text-amber-400"></i>
                    </div>
                    <div>
                        <h3 class="text-sm font-semibold text-white flex items-center gap-2">
                            Slate Leaders & Laggards
                            <span class="text-xs text-slate-400 font-normal">(Click to toggle)</span>
                        </h3>
                        <p class="text-xs text-slate-400">Top 10 Best and Bottom 10 Worst performances across all daily box scores</p>
                    </div>
                </div>
                <div class="flex items-center gap-2 text-slate-400">
                    <i id="icon-leaderboard-chevron" data-lucide="chevron-down" class="w-5 h-5 transition-transform duration-200"></i>
                </div>
            </button>

            <!-- Leaderboard Content Body -->
            <div id="leaderboard-content" class="hidden p-4 sm:p-6 grid grid-cols-1 lg:grid-cols-2 gap-6 bg-slate-900/50">
                <!-- Top 10 Performers -->
                <div class="bg-slate-950/60 rounded-xl border border-slate-800 p-4">
                    <div class="flex items-center justify-between mb-3 pb-2 border-b border-slate-800">
                        <h4 class="text-xs font-bold tracking-wider text-emerald-400 uppercase flex items-center gap-1.5">
                            <i data-lucide="trending-up" class="w-3.5 h-3.5"></i> Top 10 Game Scores
                        </h4>
                        <span class="text-[10px] text-slate-500 uppercase font-mono">GmSc Formula</span>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-xs">
                            <thead class="text-[10px] uppercase text-slate-500 bg-slate-900/80">
                                <tr>
                                    <th class="py-2 px-2">#</th>
                                    <th class="py-2 px-2">Player</th>
                                    <th class="py-2 px-2 text-center">Team</th>
                                    <th class="py-2 px-2 text-right">PTS</th>
                                    <th class="py-2 px-2 text-right">REB</th>
                                    <th class="py-2 px-2 text-right">AST</th>
                                    <th class="py-2 px-2 text-right font-bold text-emerald-400">GmSc</th>
                                </tr>
                            </thead>
                            <tbody id="top-performers-tbody" class="divide-y divide-slate-800/40 text-slate-300">
                                <!-- Populated dynamically -->
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Bottom 10 Performers -->
                <div class="bg-slate-950/60 rounded-xl border border-slate-800 p-4">
                    <div class="flex items-center justify-between mb-3 pb-2 border-b border-slate-800">
                        <h4 class="text-xs font-bold tracking-wider text-rose-400 uppercase flex items-center gap-1.5">
                            <i data-lucide="trending-down" class="w-3.5 h-3.5"></i> Bottom 10 Game Scores
                        </h4>
                        <span class="text-[10px] text-slate-500 uppercase font-mono">Min 15 Mins</span>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-xs">
                            <thead class="text-[10px] uppercase text-slate-500 bg-slate-900/80">
                                <tr>
                                    <th class="py-2 px-2">#</th>
                                    <th class="py-2 px-2">Player</th>
                                    <th class="py-2 px-2 text-center">Team</th>
                                    <th class="py-2 px-2 text-right">PTS</th>
                                    <th class="py-2 px-2 text-right">REB</th>
                                    <th class="py-2 px-2 text-right">AST</th>
                                    <th class="py-2 px-2 text-right font-bold text-rose-400">GmSc</th>
                                </tr>
                            </thead>
                            <tbody id="bottom-performers-tbody" class="divide-y divide-slate-800/40 text-slate-300">
                                <!-- Populated dynamically -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </section>

        <!-- Games List Feed -->
        <div id="games-container" class="space-y-6">
            <!-- Game Cards dynamically injected here -->
        </div>

    </main>

    <!-- Application Script Logic -->
    <script>
        // Global State
        const state = {
            selectedDate: getTodayNYString(),
            games: [],
            expandedGames: new Set(), // Games collapsed by default
            isLeaderboardExpanded: false, // Leaders & Laggards collapsed by default
            loading: false
        };

        // Helper: Get Today's date in America/New_York (US Eastern)
        function getTodayNYString() {
            const now = new Date();
            const nyDateString = new Intl.DateTimeFormat('en-CA', {
                timeZone: 'America/New_York',
                year: 'numeric',
                month: '2-digit',
                day: '2-digit'
            }).format(now);
            return nyDateString;
        }

        // Helper: Calculate Game Score
        // Formula: PTS + 0.4*FGM - 0.7*FGA - 0.4*(FTA - FTM) + 0.7*OREB + 0.3*DREB + STL + 0.7*AST + 0.7*BLK - 0.4*PF - TOV
        function calculateGameScore(stats) {
            const pts = stats.pts || 0;
            const fgm = stats.fgm || 0;
            const fga = stats.fga || 0;
            const ftm = stats.ftm || 0;
            const fta = stats.fta || 0;
            const oreb = stats.oreb || 0;
            const dreb = stats.dreb || 0;
            const stl = stats.stl || 0;
            const ast = stats.ast || 0;
            const blk = stats.blk || 0;
            const pf = stats.pf || 0;
            const tov = stats.tov || 0;

            const gmSc = pts + (0.4 * fgm) - (0.7 * fga) - (0.4 * (fta - ftm)) + (0.7 * oreb) + (0.3 * dreb) + stl + (0.7 * ast) + (0.7 * blk) - (0.4 * pf) - tov;
            return Math.round(gmSc * 10) / 10;
        }

        // Clean SVG Logo Component Helper with Text Fallback
        function getTeamLogoHtml(teamAbbrev, sizeClasses = "w-7 h-7") {
            const logoUrl = `https://a.espncdn.com/i/teamlogos/nba/500/${teamAbbrev.toLowerCase()}.png`;
            return `
                <img src="${logoUrl}" 
                     alt="${teamAbbrev}" 
                     class="${sizeClasses} object-contain inline-block"
                     onerror="this.onerror=null; this.parentNode.innerHTML='<span class=\'${sizeClasses} rounded-full bg-slate-700 text-slate-300 font-bold flex items-center justify-center text-[10px]\'>${teamAbbrev}</span>';" />
            `;
        }

        // Initialize App
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            setupEventListeners();
            fetchSlateData(state.selectedDate);
        });

        function setupEventListeners() {
            // Date Picker
            const datePicker = document.getElementById('date-picker');
            datePicker.value = state.selectedDate;
            datePicker.addEventListener('change', (e) => {
                if (e.target.value) {
                    state.selectedDate = e.target.value;
                    fetchSlateData(state.selectedDate);
                }
            });

            // Quick Date Buttons
            document.getElementById('btn-today').addEventListener('click', () => {
                state.selectedDate = getTodayNYString();
                datePicker.value = state.selectedDate;
                fetchSlateData(state.selectedDate);
            });

            document.getElementById('btn-yesterday').addEventListener('click', () => {
                const date = new Date(state.selectedDate + 'T12:00:00');
                date.setDate(date.getDate() - 1);
                state.selectedDate = date.toISOString().split('T')[0];
                datePicker.value = state.selectedDate;
                fetchSlateData(state.selectedDate);
            });

            document.getElementById('btn-prev-day').addEventListener('click', () => {
                const date = new Date(state.selectedDate + 'T12:00:00');
                date.setDate(date.getDate() - 1);
                state.selectedDate = date.toISOString().split('T')[0];
                datePicker.value = state.selectedDate;
                fetchSlateData(state.selectedDate);
            });

            document.getElementById('btn-next-day').addEventListener('click', () => {
                const date = new Date(state.selectedDate + 'T12:00:00');
                date.setDate(date.getDate() + 1);
                state.selectedDate = date.toISOString().split('T')[0];
                datePicker.value = state.selectedDate;
                fetchSlateData(state.selectedDate);
            });

            // Toggle Expand/Collapse All Box Scores
            document.getElementById('btn-toggle-all-games').addEventListener('click', () => {
                if (state.expandedGames.size === state.games.length) {
                    state.expandedGames.clear();
                } else {
                    state.games.forEach(g => state.expandedGames.add(g.id));
                }
                renderGames();
            });

            // Toggle Leaders & Laggards Accordion
            document.getElementById('btn-toggle-leaderboard').addEventListener('click', () => {
                state.isLeaderboardExpanded = !state.isLeaderboardExpanded;
                updateLeaderboardVisibility();
            });
        }

        function updateLeaderboardVisibility() {
            const content = document.getElementById('leaderboard-content');
            const chevron = document.getElementById('icon-leaderboard-chevron');
            if (state.isLeaderboardExpanded) {
                content.classList.remove('hidden');
                chevron.classList.add('rotate-180');
            } else {
                content.classList.add('hidden');
                chevron.classList.remove('rotate-180');
            }
        }

        // Fetch Slate Box Scores (Using ESPN Public Endpoint with local fallback demo generator)
        async function fetchSlateData(dateStr) {
            state.loading = true;
            renderLoadingState();

            const formattedDate = dateStr.replace(/-/g, '');
            const espnUrl = `https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard?dates=${formattedDate}`;

            try {
                const res = await fetch(espnUrl);
                const data = await res.json();
                
                if (data && data.events) {
                    state.games = parseEspnData(data.events);
                } else {
                    state.games = generateMockGames(dateStr);
                }
            } catch (err) {
                console.warn('Live API fetch failed, loading generated slate mock:', err);
                state.games = generateMockGames(dateStr);
            }

            state.loading = false;
            updateSlateHeader();
            renderMiniScoreboard();
            renderTopPerformers();
            renderGames();
        }

        function renderLoadingState() {
            const container = document.getElementById('games-container');
            container.innerHTML = `
                <div class="flex flex-col items-center justify-center py-16 text-slate-500">
                    <div class="w-8 h-8 border-4 border-indigo-500/30 border-t-indigo-500 rounded-full animate-spin mb-3"></div>
                    <p class="text-sm font-medium">Fetching NBA Box Scores...</p>
                </div>
            `;
        }

        function updateSlateHeader() {
            const d = new Date(state.selectedDate + 'T12:00:00');
            const formattedDate = d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
            document.getElementById('slate-header-title').textContent = `NBA Slate — ${formattedDate}`;
            document.getElementById('slate-game-count').textContent = `${state.games.length} Games Displayed`;
        }

        function renderMiniScoreboard() {
            const strip = document.getElementById('mini-scoreboard-strip');
            strip.innerHTML = '';

            if (state.games.length === 0) {
                strip.innerHTML = `<span class="text-xs text-slate-500">No games scheduled for this date.</span>`;
                return;
            }

            state.games.forEach(game => {
                const chip = document.createElement('button');
                chip.className = `flex items-center gap-2.5 px-3 py-1.5 rounded-xl border border-slate-800 bg-slate-950/80 hover:bg-slate-800 hover:border-indigo-500/50 transition cursor-pointer flex-shrink-0 text-xs shadow-sm`;
                chip.onclick = () => scrollToGame(game.id);

                chip.innerHTML = `
                    <div class="flex items-center gap-1.5">
                        ${getTeamLogoHtml(game.awayTeam.abbrev, "w-4 h-4")}
                        <span class="font-semibold text-slate-300">${game.awayTeam.abbrev}</span>
                        <span class="font-bold text-slate-100">${game.awayTeam.score}</span>
                    </div>
                    <span class="text-slate-600 font-bold">@</span>
                    <div class="flex items-center gap-1.5">
                        <span class="font-bold text-slate-100">${game.homeTeam.score}</span>
                        <span class="font-semibold text-slate-300">${game.homeTeam.abbrev}</span>
                        ${getTeamLogoHtml(game.homeTeam.abbrev, "w-4 h-4")}
                    </div>
                    <span class="ml-1 text-[10px] px-1.5 py-0.5 rounded font-mono ${game.status.includes('FINAL') ? 'bg-slate-800 text-slate-400' : 'bg-amber-500/20 text-amber-400 font-bold'}">${game.status}</span>
                `;

                strip.appendChild(chip);
            });
        }

        function scrollToGame(gameId) {
            state.expandedGames.add(gameId);
            renderGames();
            setTimeout(() => {
                const el = document.getElementById(`game-card-${gameId}`);
                if (el) {
                    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    el.classList.add('ring-2', 'ring-indigo-500');
                    setTimeout(() => el.classList.remove('ring-2', 'ring-indigo-500'), 2000);
                }
            }, 50);
        }

        function renderTopPerformers() {
            const allPlayers = [];
            state.games.forEach(g => {
                const homeRecord = g.homeTeam.record || '';
                const awayRecord = g.awayTeam.record || '';
                
                g.awayTeam.players.forEach(p => {
                    allPlayers.push({ ...p, team: g.awayTeam.abbrev, gameStatus: g.status });
                });
                g.homeTeam.players.forEach(p => {
                    allPlayers.push({ ...p, team: g.homeTeam.abbrev, gameStatus: g.status });
                });
            });

            // Sort by Game Score descending
            allPlayers.sort((a, b) => b.gmSc - a.gmSc);

            // Top 10
            const top10 = allPlayers.slice(0, 10);
            const topTbody = document.getElementById('top-performers-tbody');
            topTbody.innerHTML = top10.map((p, i) => `
                <tr class="hover:bg-slate-850/50 transition">
                    <td class="py-1.5 px-2 font-mono text-slate-500">${i + 1}</td>
                    <td class="py-1.5 px-2 font-medium text-white flex items-center gap-1.5">
                        ${getTeamLogoHtml(p.team, "w-3.5 h-3.5")}
                        ${p.name}
                    </td>
                    <td class="py-1.5 px-2 text-center text-slate-400 font-mono">${p.team}</td>
                    <td class="py-1.5 px-2 text-right font-semibold text-slate-200">${p.pts}</td>
                    <td class="py-1.5 px-2 text-right text-slate-400">${p.reb}</td>
                    <td class="py-1.5 px-2 text-right text-slate-400">${p.ast}</td>
                    <td class="py-1.5 px-2 text-right font-bold text-emerald-400 font-mono">${p.gmSc}</td>
                </tr>
            `).join('');

            // Bottom 10 (Filter for min 15 minutes played to prevent 0-minute clutter)
            const eligibleBottom = allPlayers.filter(p => (p.min || 0) >= 15);
            eligibleBottom.sort((a, b) => a.gmSc - b.gmSc);

            const bottom10 = eligibleBottom.slice(0, 10);
            const bottomTbody = document.getElementById('bottom-performers-tbody');
            bottomTbody.innerHTML = bottom10.map((p, i) => `
                <tr class="hover:bg-slate-850/50 transition">
                    <td class="py-1.5 px-2 font-mono text-slate-500">${i + 1}</td>
                    <td class="py-1.5 px-2 font-medium text-white flex items-center gap-1.5">
                        ${getTeamLogoHtml(p.team, "w-3.5 h-3.5")}
                        ${p.name}
                    </td>
                    <td class="py-1.5 px-2 text-center text-slate-400 font-mono">${p.team}</td>
                    <td class="py-1.5 px-2 text-right font-semibold text-slate-200">${p.pts}</td>
                    <td class="py-1.5 px-2 text-right text-slate-400">${p.reb}</td>
                    <td class="py-1.5 px-2 text-right text-slate-400">${p.ast}</td>
                    <td class="py-1.5 px-2 text-right font-bold text-rose-400 font-mono">${p.gmSc}</td>
                </tr>
            `).join('');
        }

        function renderGames() {
            const container = document.getElementById('games-container');
            container.innerHTML = '';

            const allExpanded = state.expandedGames.size === state.games.length && state.games.length > 0;
            document.getElementById('lbl-toggle-all').textContent = allExpanded ? 'Collapse All' : 'Expand All';

            if (state.games.length === 0) {
                container.innerHTML = `
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-12 text-center">
                        <i data-lucide="calendar-x" class="w-12 h-12 text-slate-600 mx-auto mb-3"></i>
                        <h3 class="text-base font-semibold text-slate-300">No Box Scores Found</h3>
                        <p class="text-xs text-slate-500 mt-1">There are no NBA games scheduled on ${state.selectedDate}.</p>
                    </div>
                `;
                return;
            }

            state.games.forEach(game => {
                const isExpanded = state.expandedGames.has(game.id);
                const gameCard = document.createElement('div');
                gameCard.id = `game-card-${game.id}`;
                gameCard.className = `bg-slate-900 border border-slate-800 rounded-2xl shadow-xl overflow-hidden transition-all duration-200`;

                gameCard.innerHTML = `
                    <!-- Game Score Header Banner (Click to Expand/Collapse) -->
                    <div onclick="toggleGameCard('${game.id}')" class="p-4 sm:p-5 bg-slate-900 hover:bg-slate-850 cursor-pointer transition flex items-center justify-between select-none">
                        
                        <!-- Fixed 3-Column Grid Layout for Perfect Alignment Across Cards -->
                        <div class="w-full grid grid-cols-[1fr_auto_1fr] items-center gap-2 sm:gap-6 max-w-4xl mx-auto">
                            
                            <!-- Away Team Column (Right Aligned to Center Score) -->
                            <div class="flex items-center justify-end gap-2 sm:gap-3 text-right">
                                <div class="hidden sm:block">
                                    <span class="text-sm sm:text-base font-bold text-white block leading-tight">${game.awayTeam.name}</span>
                                    <span class="text-xs text-slate-400 font-mono">${game.awayTeam.abbrev} ${game.awayTeam.record ? `(${game.awayTeam.record})` : ''}</span>
                                </div>
                                <span class="sm:hidden font-bold text-white text-sm">${game.awayTeam.abbrev}</span>
                                ${getTeamLogoHtml(game.awayTeam.abbrev, "w-8 h-8 sm:w-10 sm:h-10")}
                            </div>

                            <!-- Central Score Box -->
                            <div class="flex flex-col items-center justify-center px-4 py-1.5 bg-slate-950/80 border border-slate-800 rounded-xl min-w-[120px]">
                                <div class="flex items-center gap-2 sm:gap-3">
                                    <span class="text-xl sm:text-2xl font-extrabold font-mono ${game.awayTeam.score >= game.homeTeam.score ? 'text-amber-400' : 'text-slate-400'}">${game.awayTeam.score}</span>
                                    <span class="text-slate-600 font-bold">-</span>
                                    <span class="text-xl sm:text-2xl font-extrabold font-mono ${game.homeTeam.score >= game.awayTeam.score ? 'text-amber-400' : 'text-slate-400'}">${game.homeTeam.score}</span>
                                </div>
                                <span class="text-[10px] font-bold uppercase tracking-wider ${game.status.includes('FINAL') ? 'text-slate-500' : 'text-emerald-400 animate-pulse'} font-mono">${game.status}</span>
                            </div>

                            <!-- Home Team Column (Left Aligned from Center Score) -->
                            <div class="flex items-center justify-start gap-2 sm:gap-3 text-left">
                                ${getTeamLogoHtml(game.homeTeam.abbrev, "w-8 h-8 sm:w-10 sm:h-10")}
                                <div class="hidden sm:block">
                                    <span class="text-sm sm:text-base font-bold text-white block leading-tight">${game.homeTeam.name}</span>
                                    <span class="text-xs text-slate-400 font-mono">${game.homeTeam.record ? `(${game.homeTeam.record})` : ''} ${game.homeTeam.abbrev}</span>
                                </div>
                                <span class="sm:hidden font-bold text-white text-sm">${game.homeTeam.abbrev}</span>
                            </div>

                        </div>

                        <!-- Chevron Toggle Icon -->
                        <div class="text-slate-500 hover:text-slate-300 ml-2">
                            <i data-lucide="chevron-down" class="w-5 h-5 transition-transform duration-200 ${isExpanded ? 'rotate-180' : ''}"></i>
                        </div>
                    </div>

                    <!-- Collapsible Full Box Score Tables -->
                    ${isExpanded ? `
                        <div class="border-t border-slate-800 p-4 sm:p-6 bg-slate-950/40 space-y-6">
                            ${renderTeamBoxTable(game.awayTeam)}
                            ${renderTeamBoxTable(game.homeTeam)}
                        </div>
                    ` : ''}
                `;

                container.appendChild(gameCard);
            });

            lucide.createIcons();
        }

        function toggleGameCard(gameId) {
            if (state.expandedGames.has(gameId)) {
                state.expandedGames.delete(gameId);
            } else {
                state.expandedGames.add(gameId);
            }
            renderGames();
        }

        function renderTeamBoxTable(team) {
            return `
                <div>
                    <!-- Team Table Header -->
                    <div class="flex items-center justify-between mb-2 px-1">
                        <div class="flex items-center gap-2">
                            ${getTeamLogoHtml(team.abbrev, "w-5 h-5")}
                            <h4 class="text-xs font-bold text-slate-200 uppercase tracking-wider">${team.name} Box Score</h4>
                            ${team.record ? `<span class="text-[11px] text-slate-400 font-mono">(${team.record})</span>` : ''}
                        </div>
                        <span class="text-[10px] text-slate-500 font-mono uppercase">Sortable Stats</span>
                    </div>

                    <!-- Table -->
                    <div class="overflow-x-auto border border-slate-800 rounded-xl bg-slate-900">
                        <table class="w-full text-left text-xs whitespace-nowrap">
                            <thead class="bg-slate-950 text-[10px] uppercase font-semibold text-slate-400 border-b border-slate-800">
                                <tr>
                                    <th class="py-2.5 px-3">Player</th>
                                    <th class="py-2.5 px-2 text-center">MIN</th>
                                    <th class="py-2.5 px-2 text-right">PTS</th>
                                    <th class="py-2.5 px-2 text-right">REB</th>
                                    <th class="py-2.5 px-2 text-right">AST</th>
                                    <th class="py-2.5 px-2 text-right">STL</th>
                                    <th class="py-2.5 px-2 text-right">BLK</th>
                                    <th class="py-2.5 px-2 text-right">FG</th>
                                    <th class="py-2.5 px-2 text-right">3PT</th>
                                    <th class="py-2.5 px-2 text-right">FT</th>
                                    <th class="py-2.5 px-2 text-right">TO</th>
                                    <th class="py-2.5 px-2 text-right">+/-</th>
                                    <th class="py-2.5 px-3 text-right font-bold text-amber-400">GmSc</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-800/60 font-mono text-slate-300">
                                ${team.players.map(p => `
                                    <tr class="hover:bg-slate-850/60 transition">
                                        <td class="py-2 px-3 font-sans font-medium text-white">${p.name}</td>
                                        <td class="py-2 px-2 text-center text-slate-400">${p.min}'</td>
                                        <td class="py-2 px-2 text-right font-bold text-white">${p.pts}</td>
                                        <td class="py-2 px-2 text-right">${p.reb}</td>
                                        <td class="py-2 px-2 text-right">${p.ast}</td>
                                        <td class="py-2 px-2 text-right text-slate-400">${p.stl}</td>
                                        <td class="py-2 px-2 text-right text-slate-400">${p.blk}</td>
                                        <td class="py-2 px-2 text-right text-slate-400">${p.fgm}-${p.fga}</td>
                                        <td class="py-2 px-2 text-right text-slate-400">${p.tpm}-${p.tpa}</td>
                                        <td class="py-2 px-2 text-right text-slate-400">${p.ftm}-${p.fta}</td>
                                        <td class="py-2 px-2 text-right text-slate-400">${p.tov}</td>
                                        <td class="py-2 px-2 text-right font-medium ${p.plusMinus > 0 ? 'text-emerald-400' : p.plusMinus < 0 ? 'text-rose-400' : 'text-slate-500'}">
                                            ${p.plusMinus > 0 ? '+' : ''}${p.plusMinus}
                                        </td>
                                        <td class="py-2 px-3 text-right font-bold ${p.gmSc >= 20 ? 'text-emerald-400' : p.gmSc <= 3 ? 'text-rose-400' : 'text-amber-400'}">
                                            ${p.gmSc}
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        // ESPN API Response Parser
        function parseEspnData(events) {
            return events.map(evt => {
                const competition = evt.competitions[0];
                const home = competition.competitors.find(c => c.homeAway === 'home');
                const away = competition.competitors.find(c => c.homeAway === 'away');

                const statusText = evt.status.type.shortDetail || evt.status.type.detail || 'FINAL';

                return {
                    id: evt.id,
                    status: statusText.toUpperCase(),
                    awayTeam: {
                        name: away.team.displayName,
                        abbrev: away.team.abbreviation,
                        score: parseInt(away.score || 0),
                        record: away.records && away.records[0] ? away.records[0].summary : '',
                        players: extractEspnPlayers(away)
                    },
                    homeTeam: {
                        name: home.team.displayName,
                        abbrev: home.team.abbreviation,
                        score: parseInt(home.score || 0),
                        record: home.records && home.records[0] ? home.records[0].summary : '',
                        players: extractEspnPlayers(home)
                    }
                };
            });
        }

        function extractEspnPlayers(competitor) {
            if (!competitor.athletes) return generateMockPlayers(competitor.team.abbreviation);

            return competitor.athletes.map(a => {
                const statsMap = {};
                if (a.stats) {
                    // ESPN stats array mapping
                    a.stats.forEach((val, idx) => {
                        statsMap[idx] = val;
                    });
                }

                const pts = parseInt(a.stats ? a.stats[13] || 0 : 0);
                const reb = parseInt(a.stats ? a.stats[7] || 0 : 0);
                const ast = parseInt(a.stats ? a.stats[8] || 0 : 0);
                const stl = parseInt(a.stats ? a.stats[9] || 0 : 0);
                const blk = parseInt(a.stats ? a.stats[10] || 0 : 0);
                const min = parseInt(a.stats ? a.stats[0] || 0 : 0);

                const fgParts = (a.stats ? a.stats[1] || '0-0' : '0-0').split('-');
                const fgm = parseInt(fgParts[0]) || 0;
                const fga = parseInt(fgParts[1]) || 0;

                const tpParts = (a.stats ? a.stats[2] || '0-0' : '0-0').split('-');
                const tpm = parseInt(tpParts[0]) || 0;
                const tpa = parseInt(tpParts[1]) || 0;

                const ftParts = (a.stats ? a.stats[3] || '0-0' : '0-0').split('-');
                const ftm = parseInt(ftParts[0]) || 0;
                const fta = parseInt(ftParts[1]) || 0;

                const tov = parseInt(a.stats ? a.stats[11] || 0 : 0);
                const pf = parseInt(a.stats ? a.stats[12] || 0 : 0);
                const plusMinus = parseInt(a.stats ? a.stats[14] || 0 : 0);

                const gmSc = calculateGameScore({ pts, fgm, fga, ftm, fta, oreb: Math.round(reb*0.3), dreb: Math.round(reb*0.7), stl, ast, blk, pf, tov });

                return {
                    name: a.athlete.shortName || a.athlete.displayName,
                    min, pts, reb, ast, stl, blk, fgm, fga, tpm, tpa, ftm, fta, tov, pf, plusMinus, gmSc
                };
            });
        }

        // Mock Data Fallback Generator
        function generateMockGames(dateStr) {
            const matchups = [
                { away: { name: 'Milwaukee Bucks', abbrev: 'MIL', record: '1-10' }, home: { name: 'New York Knicks', abbrev: 'NY', record: '6-4' }, awayScore: 85, homeScore: 117, status: 'FINAL' },
                { away: { name: 'Boston Celtics', abbrev: 'BOS', record: '9-2' }, home: { name: 'Philadelphia 76ers', abbrev: 'PHI', record: '9-3' }, awayScore: 123, homeScore: 101, status: 'FINAL' },
                { away: { name: 'LA Clippers', abbrev: 'LAC', record: '2-7' }, home: { name: 'Phoenix Suns', abbrev: 'PHX', record: '3-6' }, awayScore: 59, homeScore: 89, status: '4:36 - 3RD' },
                { away: { name: 'Miami Heat', abbrev: 'MIA', record: '4-6' }, home: { name: 'Utah Jazz', abbrev: 'UTAH', record: '1-9' }, awayScore: 64, homeScore: 58, status: '10:08 - 3RD' },
                { away: { name: 'Golden State Warriors', abbrev: 'GSW', record: '8-3' }, home: { name: 'Denver Nuggets', abbrev: 'DEN', record: '7-3' }, awayScore: 0, homeScore: 0, status: '10:00 PM ET' }
            ];

            return matchups.map((m, idx) => ({
                id: `mock-game-${idx}`,
                status: m.status,
                awayTeam: {
                    ...m.away,
                    score: m.awayScore,
                    players: generateMockPlayers(m.away.abbrev)
                },
                homeTeam: {
                    ...m.home,
                    score: m.homeScore,
                    players: generateMockPlayers(m.home.abbrev)
                }
            }));
        }

        function generateMockPlayers(teamCode) {
            const names = [
                "J. Tatum", "J. Brown", "D. White", "J. Holiday", "A. Horford",
                "P. Pritchard", "S. Hauser", "L. Kornet", "X. Tillman", "O. Brissett"
            ];

            return names.map((name, i) => {
                const min = i < 5 ? 30 + Math.floor(Math.random() * 8) : 10 + Math.floor(Math.random() * 12);
                const pts = i === 0 ? 32 : i === 1 ? 24 : Math.floor(Math.random() * 15);
                const reb = Math.floor(Math.random() * 10);
                const ast = Math.floor(Math.random() * 8);
                const stl = Math.floor(Math.random() * 3);
                const blk = Math.floor(Math.random() * 2);
                const fgm = Math.floor(pts / 2.2);
                const fga = fgm + Math.floor(Math.random() * 5);
                const tpm = Math.floor(Math.random() * 4);
                const tpa = tpm + Math.floor(Math.random() * 3);
                const ftm = Math.floor(Math.random() * 6);
                const fta = ftm + Math.floor(Math.random() * 2);
                const tov = Math.floor(Math.random() * 4);
                const pf = Math.floor(Math.random() * 4);
                const plusMinus = Math.floor(Math.random() * 26) - 13;

                const gmSc = calculateGameScore({ pts, fgm, fga, ftm, fta, oreb: 2, dreb: reb, stl, ast, blk, pf, tov });

                return { name, min, pts, reb, ast, stl, blk, fgm, fga, tpm, tpa, ftm, fta, tov, pf, plusMinus, gmSc };
            });
        }
    </script>
